<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surat Pengawas Sekolah</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f1ec;--surf:#fff;--ink:#1c2740;--mute:#667088;--line:#d9d6cd;--acc:#1f3a6e;--accfg:#fff;--wait:#b4471f;--waitbg:#fbe9e0;--ok:#1f6b4a;--okbg:#e2f1e9;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a26;--surf:#1d2434;--ink:#e7eaf2;--mute:#9aa4bb;--line:#33405a;--acc:#8fb0ee;--accfg:#10192b;--wait:#f0a07f;--waitbg:#3a2418;--ok:#7fd1a6;--okbg:#18342a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151a26;--surf:#1d2434;--ink:#e7eaf2;--mute:#9aa4bb;--line:#33405a;--acc:#8fb0ee;--accfg:#10192b;--wait:#f0a07f;--waitbg:#3a2418;--ok:#7fd1a6;--okbg:#18342a;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,sans-serif}
*,*::before,*::after{box-sizing:inherit}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;margin:0}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0 16px}
header.top h1{font-size:24px;flex:1;min-width:200px}
header.top small{display:block;font:500 14px "Source Sans 3",sans-serif;color:var(--mute)}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:600 15px inherit;font-family:inherit;color:var(--mute);cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--acc)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{background:var(--acc);color:var(--accfg);border:0;border-radius:6px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--wait);border:1px solid var(--wait)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:14px}
.stat b{display:block;font:700 30px "Source Serif 4",serif}
.stat span{color:var(--mute);font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar select,.bar input{background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.bar input{flex:1;min-width:160px}
.row{display:flex;gap:12px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px;cursor:pointer;flex-wrap:wrap}
.row:hover{border-color:var(--acc)}
.row .main{flex:1;min-width:200px}
.row .main b{display:block}
.row .main span{color:var(--mute);font-size:14px}
.badge{font-size:13px;font-weight:600;border-radius:99px;padding:3px 10px}
.badge.wait{background:var(--waitbg);color:var(--wait)}
.badge.ok{background:var(--okbg);color:var(--ok)}
.code{font:600 14px ui-monospace,Menlo,monospace;background:var(--bg);border:1px dashed var(--line);border-radius:4px;padding:2px 8px}
.empty{text-align:center;color:var(--mute);padding:36px 12px;border:1px dashed var(--line);border-radius:8px}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.type{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:10px}
.type h3{font-size:20px}
.type ul{margin:0;padding-left:18px;color:var(--mute);font-size:15px}
.type .btns{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
.form{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:18px;display:grid;gap:14px}
.form label{display:grid;gap:4px;font-weight:600;font-size:14px}
.form input[type=text],.form input[type=date],.form select,.form textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-weight:400}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.chk{display:flex;gap:16px;flex-wrap:wrap}.chk label{display:flex;flex-direction:row;gap:6px;align-items:center;font-weight:400;font-size:16px}
.guru{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:6px}
.guru input{min-width:0}
@media(max-width:640px){.guru{grid-template-columns:1fr 1fr}}
.note{color:var(--mute);font-size:14px}
.side{display:grid;grid-template-columns:1fr;gap:16px}
.sign{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px}
canvas{width:100%;max-width:420px;height:150px;background:#fff;border:1px solid var(--line);border-radius:6px;touch-action:none;cursor:crosshair}
/* kertas surat: selalu putih agar seperti dokumen cetak */
.paper{background:#fff;color:#111;font:14px/1.55 "Source Serif 4",Georgia,serif;border:1px solid var(--line);padding:36px 40px;border-radius:2px;box-shadow:0 1px 0 var(--line);overflow-x:auto}
.paper h2{text-align:center;font-size:17px;text-decoration:underline;margin:14px 0 2px}
.paper .kop{text-align:center;line-height:1.35}
.paper .kop b{display:block}
.paper .ctr{text-align:center}
.paper table{border-collapse:collapse;width:100%}
.paper .kv td{padding:1px 4px;vertical-align:top}
.paper .grid td,.paper .grid th{border:1px solid #111;padding:5px 7px;font-weight:400;text-align:left;vertical-align:top}
.paper .grid th{font-weight:700;text-align:center}
.ttd{display:flex;justify-content:flex-end;margin-top:22px}
.ttd.two{justify-content:space-between}
.ttd div{text-align:center;min-width:200px}
.ttd img{height:64px;max-width:100%;object-fit:contain;display:block;margin:4px auto}
.ttd .gap{height:72px}
.hidden{display:none!important}
.gate{max-width:440px;margin:40px auto;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:24px;display:grid;gap:12px}
.gate #kode{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;font:600 20px ui-monospace,Menlo,monospace;letter-spacing:.2em;text-align:center;text-transform:uppercase}
.msg{padding:10px 12px;border-radius:6px;background:var(--waitbg);color:var(--wait);font-size:14px}
.okmsg{background:var(--okbg);color:var(--ok)}
@media print{body{background:#fff}header.top,nav,.sign,.noprint{display:none!important}.paper{border:0;padding:0}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Surat Pengawas Sekolah<small>Makmur Nonci, S.Pd., MM.Pd. · Kec. Bacukiki Barat</small></h1>
    <span id="role" class="badge ok"></span>
  </header>
  <div id="app"></div>
</div>

<script>
const PENGAWAS={nama:"MAKMUR NONCI, S.Pd., MM.Pd",nip:"19680115 198809 1 001"};
const TYPES={
  supervisi:{nama:"Surat Pernyataan Supervisi",ket:"Pernyataan kepala sekolah bahwa pengawas telah melakukan supervisi kepada guru.",isi:["Data kepala sekolah dilengkapi saat menandatangani","Tabel guru yang disupervisi: nama/NIP, kelas, tanggal, mapel","Ditandatangani kepala sekolah"]},
  aktivitas:{nama:"Lembar Aktivitas Pengawas",ket:"Catatan kegiatan pengawas di sekolah binaan, diketahui kepala sekolah.",isi:["Jenis kegiatan: pembinaan, supervisi, monitoring, pendampingan","Tempat, hari/tanggal, dan keterangan","Mengetahui: kepala sekolah"]},
  kustom:{nama:"Surat Kustom (bebas)",ket:"Surat dengan judul, isi, dan penandatangan yang Anda tentukan sendiri.",isi:["Judul, nomor, penerima, dan isi surat ditulis bebas","Penandatangan: pengawas dan kepala sekolah, pengawas dan guru, atau pengawas saja","Pengawas menandatangani langsung di aplikasi (gambar atau scan)"]}
};
const judul=l=>l.type==="kustom"?((l.data&&l.data.judul)||TYPES.kustom.nama):(TYPES[l.type]||{}).nama||"Surat";
const own=l=>!!(l.data&&l.data.dari==="sekolah");
const penanda=l=>{const p=(l.data&&l.data.pihak)||"kepala";if(own(l))return"Dari kepala sekolah: "+(l.kepala||"-");return p==="none"?"Ditandatangani pengawas saja":(p==="guru"?"Guru: ":"Kepala sekolah: ")+(l.kepala||"-")};
const peranLabel=p=>({operator:"Operator",guru:"Guru"}[p]||"Kepala sekolah");
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tgl=d=>d?new Date(d).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"}):".....................";
const dots=(v,n=40)=>v?esc(v):".".repeat(n);
let db=null,isPengawas=false,col=null,letters=[],tab="dash",openId=null,filter={st:"",ty:"",q:""},draftType="supervisi",unsub=null,gateMsg="";
const app=$("#app");

async function init(){
  let user=null;try{user=await claude.use("user")}catch(e){}
  try{db=await claude.use("db")}catch(e){}
  try{isPengawas=user?await user.canEdit():false}catch(e){}
  $("#role").textContent=isPengawas?"Pengawas":"Kepala sekolah";
  if(!db){app.innerHTML='<div class="empty">Masuk ke akun claude.ai untuk membuka dashboard ini.</div>';return}
  col=db.collection("surat");
  if(isPengawas){unsub=col.orderBy("createdAt","desc").onSnapshot(s=>{letters=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>{app.innerHTML='<div class="empty">Data tidak dapat dimuat.</div>'})}
  const h=location.hash.replace("#","");
  if(!isPengawas&&h)bukaKode(h);else render();
}

function render(){
  if(!isPengawas){return renderKepsek()}
  if(openId){const s=letters.find(x=>x.id===openId);return s?renderDetail(s):(openId=null,render())}
  const pend=peng.filter(p=>p.status==="menunggu"&&!appr.find(a=>a.id===p.id)).length;const tabs=[["dash","Dashboard"],["jenis","Jenis surat"],["baru","Surat baru"],["sek","Sekolah binaan"],["izin","Persetujuan"+(pend?" ("+pend+")":"")]];
  app.innerHTML=`<nav role="tablist">${tabs.map(([k,v])=>`<button role="tab" aria-selected="${tab===k}" data-t="${k}">${v}</button>`).join("")}</nav><div id="body"></div>`;
  app.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  ({dash:vDash,jenis:vJenis,baru:vBaru,sek:vSek,izin:vIzin})[tab]();
}

function vDash(){
  const w=letters.filter(l=>l.status==="menunggu").length,o=letters.length-w;
  const f=letters.filter(l=>(!filter.st||l.status===filter.st)&&(!filter.ty||l.type===filter.ty)&&(!filter.q||((l.school||"")+" "+(l.kepala||"")+" "+judul(l)).toLowerCase().includes(filter.q.toLowerCase())));
  $("#body").innerHTML=`<div class="stats"><div class="stat"><b>${letters.length}</b><span>Total surat</span></div><div class="stat"><b style="color:var(--wait)">${w}</b><span>Menunggu tanda tangan</span></div><div class="stat"><b style="color:var(--ok)">${o}</b><span>Sudah ditandatangani</span></div></div>
  <div class="bar"><input id="q" placeholder="Cari sekolah atau kepala sekolah" value="${esc(filter.q)}"><select id="fs"><option value="">Semua status</option><option value="menunggu">Menunggu</option><option value="ditandatangani">Ditandatangani</option></select><select id="ft"><option value="">Semua jenis</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v.nama}</option>`).join("")}</select></div>
  <div id="list">${f.length?f.map(l=>`<div class="row" tabindex="0" data-id="${l.id}"><div class="main"><b>${esc(l.school)}</b><span>${esc(judul(l))} · ${esc(penanda(l))} · dibuat ${tgl(l.createdAt)}</span></div><span class="badge ${l.status==="menunggu"?"wait":"ok"}">${l.status==="menunggu"?"Menunggu TTD":"Ditandatangani"}</span></div>`).join(""):`<div class="empty">${letters.length?"Tidak ada surat yang cocok.":"Belum ada surat. Buka tab Surat baru untuk membuat yang pertama."}</div>`}</div>`;
  $("#fs").value=filter.st;$("#ft").value=filter.ty;
  $("#q").oninput=e=>{filter.q=e.target.value;vDash();const q=$("#q");q.focus();q.setSelectionRange(99,99)};
  $("#fs").onchange=e=>{filter.st=e.target.value;vDash()};$("#ft").onchange=e=>{filter.ty=e.target.value;vDash()};
  document.querySelectorAll(".row").forEach(r=>{r.onclick=()=>{openId=r.dataset.id;render()};r.onkeydown=e=>{if(e.key==="Enter")r.click()}});
}

function vJenis(){
  $("#body").innerHTML=`<p class="note" style="margin-top:0">Daftar jenis surat yang tersedia. Pilih satu untuk membuat surat baru.</p><div class="types">${Object.entries(TYPES).map(([k,v])=>{const n=letters.filter(l=>l.type===k).length;return`<div class="type"><h3>${v.nama}</h3><div>${v.ket}</div><ul>${v.isi.map(i=>`<li>${i}</li>`).join("")}</ul><div class="note">${n} surat dibuat</div><div class="btns"><button class="btn" data-use="${k}">Buat surat ini</button><button class="btn ghost" data-pv="${k}">Lihat contoh</button></div></div>`}).join("")}</div><div id="pv" style="margin-top:20px"></div>`;
  document.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>{draftType=b.dataset.use;tab="baru";render()});
  document.querySelectorAll("[data-pv]").forEach(b=>b.onclick=()=>{$("#pv").innerHTML=paper({type:b.dataset.pv,data:{guru:[{},{},{}],kegiatan:[],judul:"Judul surat",isi:"Isi surat ditulis di sini.",pihak:"kepala"},status:"menunggu"});$("#pv").scrollIntoView({behavior:"smooth"})});
}

function vBaru(){
  const t=draftType,k=t==="kustom";
  $("#body").innerHTML=`<div class="form"><div class="g2"><label>Jenis surat<select id="f_type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${k===t?"selected":""}>${v.nama}</option>`).join("")}</select></label><label>Sekolah binaan<select id="f_school">${sek.length?sek.map(x=>`<option value="${x.id}">${esc(x.nama)}</option>`).join(""):'<option value="">Belum ada sekolah</option>'}</select></label></div>
  ${k?`<div class="g2"><label>Judul surat<input type="text" id="f_judul" placeholder="Contoh: Surat Pernyataan ..."></label><label>Nomor surat (opsional)<input type="text" id="f_nomor"></label></div>
  <label>Kepada (opsional)<input type="text" id="f_kepada" placeholder="Contoh: Kepala UPTD SDN ... atau Bapak/Ibu Guru"></label>
  <div class="g2"><label>Tempat<input type="text" id="f_tempat" value="Parepare"></label><label>Tanggal surat<input type="date" id="f_tglsurat" value="${new Date().toISOString().slice(0,10)}"></label></div>
  <label>Isi surat<textarea id="f_isi" rows="10" placeholder="Tulis isi surat. Setiap baris baru akan tampil sebagai baris baru di surat."></textarea></label>
  <label>Ditandatangani oleh<select id="f_pihak"><option value="kepala">Pengawas dan Kepala Sekolah</option><option value="guru">Pengawas dan Guru</option><option value="none">Pengawas saja</option></select></label>
  <label id="w_guru" class="hidden"><span>Guru penandatangan (akun terdaftar)</span><select id="f_guru"></select></label>`:""}
  <div class="g2" id="w_nama"><label><span id="l_kepala">Nama kepala sekolah (penerima)</span><input type="text" id="f_kepala"></label><label><span id="l_nip">NIP kepala sekolah (opsional)</span><input type="text" id="f_nip"></label></div>
  ${k?"":t==="supervisi"?`<label>Jenis supervisi<select id="f_jenis"><option>akademik</option><option>manajerial</option><option>akademik/manajerial</option></select></label><div><b style="font-size:14px">Guru yang disupervisi</b><div id="gurus" style="display:grid;gap:6px;margin-top:6px"></div><button class="btn ghost" id="addg" type="button" style="margin-top:8px">Tambah guru</button></div>`:
  `<div><b style="font-size:14px">Jenis kegiatan</b><div class="chk" style="margin-top:6px">${["Pembinaan","Supervisi","Monitoring","Pendampingan"].map(k=>`<label><input type="checkbox" name="keg" value="${k}">${k}</label>`).join("")}</div></div><div class="g2"><label>Lain-lain (sebutkan)<input type="text" id="f_lain"></label><label>Dilaksanakan di<input type="text" id="f_di"></label></div><label>Hari / tanggal<input type="date" id="f_tgl"></label><label>Keterangan<textarea id="f_ket" rows="4"></textarea></label>`}
  ${(k||t==="supervisi")?`<details style="border:1px solid var(--line);border-radius:8px;padding:10px 12px"><summary style="cursor:pointer"><b>Kop surat</b> (klik untuk mengubah)</summary><div id="kophost" style="display:grid;gap:10px;margin-top:10px"></div><label style="display:flex;flex-direction:row;gap:8px;font-weight:400;align-items:center;margin-top:10px"><input type="checkbox" id="k_def"> Simpan sebagai kop bawaan di perangkat ini</label></details>`:""}
  <div id="err"></div><div><button class="btn" id="save">Buat surat dan kode akses</button></div></div>`;
  $("#f_type").onchange=e=>{draftType=e.target.value;vBaru()};
  const sch=$("#f_school"),pil=()=>k?$("#f_pihak").value:"kepala";
  const isiGuru=()=>{if(!k)return;const g=appr.filter(x=>x.sekolahId===sch.value&&x.peran==="guru");$("#f_guru").innerHTML='<option value="">Tulis manual (ditandatangani langsung di kertas)</option>'+g.map(x=>`<option value="${x.id}">${esc(x.nama)}</option>`).join("")};
  const isiNama=()=>{const q=pil();let a=null;if(q==="kepala")a=appr.find(x=>x.sekolahId===sch.value&&(x.peran||"kepala")==="kepala");else if(q==="guru")a=appr.find(x=>x.id===$("#f_guru").value);if(a){$("#f_kepala").value=a.nama;$("#f_nip").value=a.nip||""}};
  const tata=()=>{if(!k)return;const q=pil();$("#w_nama").classList.toggle("hidden",q==="none");$("#w_guru").classList.toggle("hidden",q!=="guru");$("#l_kepala").textContent=q==="guru"?"Nama guru":"Nama kepala sekolah (penerima)";$("#l_nip").textContent=q==="guru"?"NIP guru (opsional)":"NIP kepala sekolah (opsional)"};
  sch.onchange=()=>{isiGuru();isiNama()};
  if(k){$("#f_pihak").onchange=()=>{$("#f_kepala").value="";$("#f_nip").value="";tata();isiNama()};$("#f_guru").onchange=()=>{if(!$("#f_guru").value){$("#f_kepala").value="";$("#f_nip").value=""}isiNama()}}
  isiGuru();tata();isiNama();
  kopEd=(k||t==="supervisi")?kopEditor($("#kophost"),kopDef(t),null):null;
  if(t==="supervisi"){const add=()=>{const d=document.createElement("div");d.className="guru";d.innerHTML=`<input type="text" placeholder="Nama guru / NIP"><input type="text" placeholder="Kelas / mapel"><input type="date"><input type="text" placeholder="Mapel disupervisi"><button type="button" class="btn ghost" aria-label="Hapus">×</button>`;d.querySelector("button").onclick=()=>d.remove();$("#gurus").append(d)};[1,2,3].forEach(add);$("#addg").onclick=add}
  $("#save").onclick=simpan;
}

async function simpan(){
  const t=draftType,sid=$("#f_school").value,school=(sek.find(x=>x.id===sid)||{}).nama||"";
  const pihak=t==="kustom"?$("#f_pihak").value:"kepala";
  const kepala=pihak==="none"?"":$("#f_kepala").value.trim(),kepNip=pihak==="none"?"":$("#f_nip").value.trim();
  if(!school){$("#err").innerHTML='<div class="msg">Pilih sekolah terlebih dahulu. Tambahkan sekolah di tab Sekolah binaan.</div>';return}
  let data={};
  if(t==="supervisi")data={jenis:$("#f_jenis").value,guru:[...document.querySelectorAll(".guru")].map(r=>{const i=r.querySelectorAll("input");return{nama:i[0].value,kelas:i[1].value,tgl:i[2].value,mapel:i[3].value}}).filter(g=>g.nama||g.mapel)};
  else if(t==="kustom"){
    const jd=$("#f_judul").value.trim(),isi=$("#f_isi").value.trim();
    if(!jd||!isi){$("#err").innerHTML='<div class="msg">Isi judul dan isi surat terlebih dahulu.</div>';return}
    data={judul:jd,nomor:$("#f_nomor").value.trim(),kepada:$("#f_kepada").value.trim(),tempat:$("#f_tempat").value.trim()||"Parepare",tglSurat:$("#f_tglsurat").value,isi,pihak};
  }

/* ---------- Kop surat ---------- */
const DEF_KOP={
  supervisi:{lines:[{t:"PEMERINTAH KOTA PAREPARE"},{t:"DINAS PENDIDIKAN DAN KEBUDAYAAN"},{t:"{sekolah}",b:true}],logo:"",logoH:70,garis:false},
  kustom:{lines:[{t:"PEMERINTAH KOTA PAREPARE"},{t:"DINAS PENDIDIKAN DAN KEBUDAYAAN"},{t:"PENGAWAS SEKOLAH KECAMATAN BACUKIKI BARAT",b:true}],logo:"",logoH:70,garis:false}
};
const kopKey=t=>t==="supervisi"?"supervisi":"kustom";
const kopDef=t=>{try{const v=JSON.parse(localStorage.getItem("kop_"+kopKey(t))||"null");if(v&&v.lines&&v.lines.length)return v}catch(e){}return DEF_KOP[kopKey(t)]};
let kopEd=null;
function kopHtml(s){
  const k=s.kop||DEF_KOP[kopKey(s.type)],sek=s.school||"UPTD SDN ..... KOTA PAREPARE";
  const txt=(k.lines||[]).filter(l=>l.t&&l.t.trim()).map(l=>{const t=esc(l.t.split("{sekolah}").join(sek));return l.b?`<b>${t}</b>`:`<div>${t}</div>`}).join("");
  const st=k.garis?"border-bottom:3px double #111;padding-bottom:8px;margin-bottom:10px;":"";
  if(!k.logo)return`<div class="kop" style="${st}">${txt}</div>`;
  const h=k.logoH||70;
  return`<div class="kop" style="${st}display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px"><img src="${k.logo}" alt="Logo" style="height:${h}px"><div>${txt}</div><img src="${k.logo}" alt="" style="height:${h}px;visibility:hidden"></div>`;
}
const kecil=file=>new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{for(const mw of [240,160,100]){const m=Math.min(1,mw/im.width),t=document.createElement("canvas");t.width=Math.max(1,Math.round(im.width*m));t.height=Math.max(1,Math.round(im.height*m));t.getContext("2d").drawImage(im,0,0,t.width,t.height);const u=t.toDataURL("image/png");if(u.length<150000||mw===100){res(u);return}}};im.src=fr.result};fr.readAsDataURL(file)});
function kopEditor(host,kop,onChange){
  const st={lines:(kop.lines||[]).map(l=>({t:l.t||"",b:!!l.b})),logo:kop.logo||"",logoH:kop.logoH||70,garis:!!kop.garis};
  if(!st.lines.length)st.lines.push({t:"",b:false});
  const fld='style="background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;width:100%"',fire=()=>{if(onChange)onChange()};
  const draw=()=>{
    host.innerHTML=`<div style="display:grid;gap:6px">${st.lines.map((l,i)=>`<div style="display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center"><input type="text" data-i="${i}" value="${esc(l.t)}" placeholder="Teks baris kop" ${fld}><label style="display:flex;flex-direction:row;gap:4px;font-weight:400;align-items:center;white-space:nowrap"><input type="checkbox" data-b="${i}" ${l.b?"checked":""}> Tebal</label><button type="button" class="btn ghost" data-x="${i}" aria-label="Hapus baris">×</button></div>`).join("")}</div>
    <div><button type="button" class="btn ghost" data-add>Tambah baris</button></div>
    <div class="note">Tulis {sekolah} pada satu baris agar otomatis diganti nama sekolah penerima.</div>
    <div style="display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px"><label>Logo (opsional)<input type="file" data-logo accept="image/*" style="padding:6px 0"></label>${st.logo?`<img src="${st.logo}" alt="Logo" style="height:48px;object-fit:contain;justify-self:start"><label>Ukuran logo: <b data-lv>${st.logoH}</b> px<input type="range" data-lh min="30" max="140" step="2" value="${st.logoH}" style="width:100%"></label><div><button type="button" class="btn ghost" data-xlogo>Hapus logo</button></div>`:""}</div>
    <label style="display:flex;flex-direction:row;gap:8px;font-weight:400;align-items:center"><input type="checkbox" data-garis ${st.garis?"checked":""}> Garis pemisah di bawah kop</label>`;
    host.querySelectorAll("[data-i]").forEach(e=>e.oninput=()=>{st.lines[+e.dataset.i].t=e.value;fire()});
    host.querySelectorAll("[data-b]").forEach(e=>e.onchange=()=>{st.lines[+e.dataset.b].b=e.checked;fire()});
    host.querySelectorAll("[data-x]").forEach(e=>e.onclick=()=>{st.lines.splice(+e.dataset.x,1);draw();fire()});
    host.querySelector("[data-add]").onclick=()=>{st.lines.push({t:"",b:false});draw();fire()};
    host.querySelector("[data-garis]").onchange=e=>{st.garis=e.target.checked;fire()};
    host.querySelector("[data-logo]").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{st.logo=await kecil(f)}catch(x){}draw();fire()};
    const lh=host.querySelector("[data-lh]");
    if(lh){lh.oninput=()=>{st.logoH=+lh.value;host.querySelector("[data-lv]").textContent=lh.value;fire()};host.querySelector("[data-xlogo]").onclick=()=>{st.logo="";draw();fire()}}
  };
  draw();
  return{get:()=>({lines:st.lines.filter(l=>l.t.trim()),logo:st.logo,logoH:st.logoH,garis:st.garis})};
}

    <table class="grid"><tr><th>No</th><th>Nama Guru/NIP.</th><th>Guru Kelas/Mapel</th><th>Hari/Tanggal Pelaksanaan</th><th>Mapel yang disupervisi</th></tr>${g.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.nama)}</td><td>${esc(x.kelas)}</td><td>${x.tgl?tgl(x.tgl):""}</td><td>${esc(x.mapel)}</td></tr>`).join("")}</table>

    <div class="ttd">${ttdKs("Parepare, "+tgl(sg.at))}</div></div>`;
  }
  if(s.type==="kustom"){

    const left=pih==="none"?"":ttdKs(pih==="guru"?"Yang bersangkutan,":"Mengetahui,");

    ${d.kepada?`<p>Kepada Yth.<br><b>${esc(d.kepada)}</b></p>`:""}<div style="white-space:pre-wrap;text-align:justify;margin:12px 0">${esc(d.isi||"Isi surat.")}</div>

/* ---------- Pad tanda tangan (gambar / scan / ukuran) ---------- */
function padTtd(host,onChange){
  host.innerHTML=`<div class="note">Gambar tanda tangan pada kotak di bawah dengan jari atau mouse, atau unggah hasil scan tanda tangan.</div><canvas width="840" height="300"></canvas>
  <div style="display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px"><label>Unggah hasil scan tanda tangan (foto/gambar)<input type="file" class="p_file" accept="image/*" style="padding:6px 0"></label>
  <label style="display:flex;flex-direction:row;gap:8px;font-weight:400;align-items:center"><input type="checkbox" class="p_bg" checked> Hapus latar putih (agar menyatu dengan kertas)</label>
  <div class="note p_msg"></div></div>
  <label>Ukuran tanda tangan: <b class="p_hv">80</b> px<input type="range" class="p_h" min="30" max="220" step="2" value="80" style="width:100%"></label>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn ghost p_clr">Hapus coretan</button><button type="button" class="btn ghost p_clrscan">Hapus scan</button></div>`;
  const q=x=>host.querySelector(x),cv=q("canvas"),c=cv.getContext("2d");
  let drawing=false,dirty=false,scanFile=null,scanImg=null;
  c.lineWidth=4;c.lineCap="round";c.lineJoin="round";c.strokeStyle="#10203f";
  const fire=()=>{q(".p_hv").textContent=q(".p_h").value;if(onChange)onChange()};
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=e=>{drawing=true;cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);c.beginPath();c.moveTo(x,y)};
  cv.onpointermove=e=>{if(!drawing)return;const[x,y]=pt(e);c.lineTo(x,y);c.stroke();dirty=true};
  cv.onpointerup=()=>{drawing=false;fire()};
  q(".p_clr").onclick=()=>{c.clearRect(0,0,cv.width,cv.height);dirty=false;fire()};
  const olah=(file,transp)=>new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
    for(const mw of [900,600,400,300]){
      const m=Math.min(1,mw/im.width),w=Math.max(1,Math.round(im.width*m)),h=Math.max(1,Math.round(im.height*m)),t=document.createElement("canvas");t.width=w;t.height=h;const x=t.getContext("2d");x.drawImage(im,0,0,w,h);
      if(transp){const d=x.getImageData(0,0,w,h),a=d.data;for(let i=0;i<a.length;i+=4){const l=.299*a[i]+.587*a[i+1]+.114*a[i+2];if(l>225)a[i+3]=0;else if(l>160)a[i+3]=Math.round(255*(225-l)/65)}x.putImageData(d,0,0)}
      const u=t.toDataURL("image/png");if(u.length<250000||mw===300){res(u);return}
    }};im.src=fr.result};fr.readAsDataURL(file)});
  const proses=async()=>{if(!scanFile)return;q(".p_msg").textContent="Memproses gambar...";try{scanImg=await olah(scanFile,q(".p_bg").checked);q(".p_msg").textContent="Scan terpasang. Geser pengaturan ukuran untuk memperbesar atau memperkecil."}catch(e){scanImg=null;q(".p_msg").textContent="Gambar tidak dapat dibaca. Coba file lain (JPG atau PNG)."}fire()};
  q(".p_file").onchange=e=>{scanFile=e.target.files[0]||null;if(scanFile)proses()};
  q(".p_bg").onchange=proses;
  q(".p_clrscan").onclick=()=>{scanFile=null;scanImg=null;q(".p_file").value="";q(".p_msg").textContent="";fire()};
  q(".p_h").oninput=fire;
  return{get:()=>({img:scanImg||(dirty?cv.toDataURL("image/png"):""),h:+q(".p_h").value}),has:()=>!!(scanImg||dirty),
    load:(img,h)=>{scanImg=img||null;if(h)q(".p_h").value=h;q(".p_msg").textContent=img?"Tanda tangan tersimpan terpasang. Ganti dengan coretan atau scan baru jika perlu.":"";fire()}};
}

/* ---------- Detail (pengawas) ---------- */
function renderDetail(s){
  const d=s.data||{},pih=d.pihak||"kepala",pgOk=s.type==="aktivitas"||s.type==="kustom",path="sekolah/"+s.sekolahId+"/surat/"+s.id;
  const wkt=(s.sign&&s.sign.at)||(s.pgSign&&s.pgSign.at);
  const info=d.dari==="sekolah"?"Surat ini dibuat dan sudah ditandatangani kepala sekolah. Tandatangani di bawah sebagai pengawas.":pih==="none"?"Surat ini hanya ditandatangani pengawas dan tidak muncul di akun sekolah.":pih==="guru"?(s.guruId?"Surat ini muncul otomatis di akun guru yang Anda pilih untuk "+esc(s.school)+".":"Guru dipilih manual, jadi surat ini dicetak dan ditandatangani langsung di kertas."):"Surat ini muncul otomatis di Ruang Kepala Sekolah untuk "+esc(s.school)+" setelah akun kepala sekolahnya Anda setujui.";

  ${(s.type==="kustom"||s.type==="supervisi")?`<details class="sign noprint" style="margin-bottom:12px"><summary style="cursor:pointer"><b>Edit kop surat</b></summary><div id="kophost" style="display:grid;gap:10px;margin-top:10px"></div><div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center"><button class="btn" id="kopsave">Simpan kop</button><label style="display:flex;flex-direction:row;gap:8px;font-weight:400;align-items:center"><input type="checkbox" id="k_def"> Jadikan kop bawaan di perangkat ini</label></div><div id="kopmsg"></div></details>`:""}
  <div id="pp">${paper(s)}</div>`;
  $("#back").onclick=()=>{openId=null;render()};
  $("#prt").onclick=()=>{try{window.print()}catch(e){}};
  $("#del").onclick=async()=>{if(confirm("Hapus surat ini?")){await db.doc(path).delete();openId=null}};
  let pad=null,curKop=s.kop;
  const view=()=>{const o={...s,kop:curKop};if(pad&&pad.has()){const g=pad.get();o.pgSign={img:g.img,h:g.h}}$("#pp").innerHTML=paper(o)};
  if($("#kophost")){
    const ke=kopEditor($("#kophost"),s.kop||DEF_KOP[kopKey(s.type)],()=>{curKop=ke.get();view()});
    $("#kopsave").onclick=async()=>{const kop=ke.get();$("#kopsave").disabled=true;
      try{await db.doc(path).update({kop});if($("#k_def").checked){try{localStorage.setItem("kop_"+kopKey(s.type),JSON.stringify(kop))}catch(e){}}$("#kopmsg").innerHTML='<div class="msg okmsg" style="margin-top:8px">Kop tersimpan.</div>'}
      catch(e){$("#kopmsg").innerHTML='<div class="msg" style="margin-top:8px">Kop belum tersimpan. Coba lagi.</div>'}
      $("#kopsave").disabled=false};
  }
  if(!pgOk)return;
  pad=padTtd($("#padhost"),view);
  let saved=s.pgSign;if(!saved){try{saved=JSON.parse(localStorage.getItem("ttd_pengawas")||"null")}catch(e){}}
  if(saved&&saved.img)pad.load(saved.img,saved.h);
  $("#pgsave").onclick=async()=>{
    if(!pad.has()){$("#err").innerHTML='<div class="msg">Gambar atau unggah tanda tangan terlebih dahulu.</div>';return}
    const g=pad.get(),upd={pgSign:{img:g.img,h:g.h,at:new Date().toISOString()}};if(pih==="none"||d.dari==="sekolah")upd.status="ditandatangani";
    $("#pgsave").disabled=true;
    try{await db.doc(path).update(upd);try{localStorage.setItem("ttd_pengawas",JSON.stringify({img:g.img,h:g.h}))}catch(e){}}
    catch(e){$("#pgsave").disabled=false;$("#err").innerHTML='<div class="msg">Tanda tangan belum tersimpan. Coba lagi.</div>'}
  };
  if($("#pgdel"))$("#pgdel").onclick=async()=>{if(!confirm("Hapus tanda tangan pengawas dari surat ini?"))return;const upd={pgSign:firebase.firestore.FieldValue.delete()};if(pih==="none"||d.dari==="sekolah")upd.status="menunggu";try{await db.doc(path).update(upd)}catch(e){$("#err").innerHTML='<div class="msg">Gagal menghapus. Coba lagi.</div>'}};
}

/* ---------- Kepala sekolah ---------- */
let cur=null;
function renderKepsek(){
  if(cur)return renderSign();
  app.innerHTML=`<div class="gate"><h2>Buka surat</h2><div class="note">Masukkan kode akses 6 karakter yang diberikan oleh Pengawas Sekolah.</div><input id="kode" maxlength="6" autocomplete="off" aria-label="Kode akses"><button class="btn" id="go">Buka surat</button>${gateMsg?`<div class="msg">${gateMsg}</div>`:""}</div>`;

async function bukaKode(k){
  k=(k||"").trim().toUpperCase();gateMsg="";
  try{const r=await col.doc(k).get();if(r.exists){cur={id:k,...r.data()}}else gateMsg="Kode tidak ditemukan. Periksa kembali kode Anda."}catch(e){gateMsg="Surat tidak dapat dibuka saat ini."}
  render();
}
function renderSign(){
  const s=cur,done=s.status==="ditandatangani",viewOnly=!!(akses&&akses.peran==="operator"),mine=own(s);
  const fld='style="background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px"';
  app.innerHTML=`<div class="bar noprint"><button class="btn ghost" id="back">Tutup</button><button class="btn ghost" id="prt">Cetak</button>${mine&&!done&&akses&&akses.peran==="kepala"?'<button class="btn danger" id="del">Hapus</button>':""}<span style="flex:1"></span><span class="badge ${done?"ok":"wait"}">${mine?(done?"Sudah ditandatangani pengawas":"Menunggu tanda tangan pengawas"):done?"Sudah ditandatangani":viewOnly?"Menunggu tanda tangan kepala sekolah":"Menunggu tanda tangan Anda"}</span></div>
  <div class="side">${mine?`<div class="msg ${done?"okmsg":""}">${done?"Surat ini sudah ditandatangani pengawas pada "+tgl(s.pgSign&&s.pgSign.at)+".":"Surat Anda sudah ditandatangani dan terkirim ke pengawas. Menunggu tanda tangan pengawas."}</div>`:done?`<div class="msg okmsg">Surat ini sudah ditandatangani pada ${tgl(s.sign&&s.sign.at)}.</div>`:viewOnly?`<div class="msg">Anda masuk sebagai operator dan hanya dapat melihat surat. Tanda tangan dilakukan oleh kepala sekolah dengan akunnya sendiri.</div>`:`<div class="sign"><h3>Tanda tangan</h3>
  <div class="g2"><label>Nama lengkap<input id="s_nama" value="${esc(s.kepala||(akses&&akses.nama)||"")}" ${fld}></label><label>NIP<input id="s_nip" value="${esc(s.kepNip||(akses&&akses.nip)||"")}" ${fld}></label></div>
  ${s.type==="supervisi"?`<div class="g2"><label>Nomor surat<input id="s_nomor" ${fld}></label><label>Alamat sekolah<input id="s_alamat" ${fld}></label></div>`:""}
  <div id="padhost" style="display:grid;gap:12px"></div>
  <div id="err"></div><div><button class="btn" id="ttd">Tandatangani surat</button></div></div>`}
  <div id="pp">${paper(s)}</div></div>`;
  $("#back").onclick=()=>{cur=null;render()};
  $("#prt").onclick=()=>{try{window.print()}catch(e){}};
  if($("#del"))$("#del").onclick=async()=>{if(!confirm("Hapus surat ini?"))return;try{await db.doc("sekolah/"+s.sekolahId+"/surat/"+s.id).delete();cur=null;render()}catch(e){flash("Gagal menghapus surat.",1)}};
  if(mine||done||viewOnly)return;
  const preview=()=>{const g=pad.get();cur.sign={nama:$("#s_nama").value,nip:$("#s_nip").value,nomor:$("#s_nomor")?.value,alamat:$("#s_alamat")?.value,img:g.img,h:g.h,at:new Date().toISOString()};$("#pp").innerHTML=paper(cur);cur.sign=undefined};
  const pad=padTtd($("#padhost"),preview);
  document.querySelectorAll("#s_nama,#s_nip,#s_nomor,#s_alamat").forEach(i=>i.oninput=preview);preview();
  $("#ttd").onclick=async()=>{
    const nama=$("#s_nama").value.trim();
    if(!nama||!pad.has()){$("#err").innerHTML='<div class="msg">Lengkapi nama dan tanda tangan (gambar atau scan).</div>';return}
    const g=pad.get(),sign={nama,nip:$("#s_nip").value.trim(),nomor:$("#s_nomor")?.value.trim()||"",alamat:$("#s_alamat")?.value.trim()||"",img:g.img,h:g.h,at:new Date().toISOString()};
    $("#ttd").disabled=true;
    try{await db.doc("sekolah/"+s.sekolahId+"/surat/"+s.id).update({status:"ditandatangani",sign});cur={...s,status:"ditandatangani",sign};renderSign()}
    catch(e){$("#ttd").disabled=false;$("#err").innerHTML='<div class="msg">Tanda tangan belum tersimpan. Pastikan Anda diberi akses sebagai Contributor, lalu coba lagi.</div>'}
  };
}
</script>

<script>
let me=null,sek=[],peng=[],appr=[],akses=null,pj=null;
const rid=()=>Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>"abcdefghjkmnpqrstuvwxyz23456789"[b%31]).join("");
const rows=q=>q.docs.map(d=>({id:d.id,...d.data()}));
const sn=(ref,fn)=>ref.onSnapshot(fn,e=>{app.innerHTML='<div class="empty">Data tidak dapat dimuat. Periksa koneksi dan aturan keamanan Firestore.</div>'});
const inp='style="background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;width:100%"';
/* ====== ISI BAGIAN INI (lihat panduan) ====== */
const FB={apiKey:"AIzaSyDR1mDn7L-EaENm-eQos9eVY-d7nOFoais",authDomain:"surat-aktivitas-ku.firebaseapp.com",projectId:"surat-aktivitas-ku",appId:"1:674813208292:web:0b6642c8cd22d494ee357d"};
const ADMIN_EMAILS=["makmurnonci4@gmail.com"];
/* ============================================ */
const tulis=p=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r({code:"timeout",message:"server tidak merespons"}),12000))]);
let started=false;const lst={},sub={};
const byNew=(a,b)=>(b.createdAt||"").localeCompare(a.createdAt||"");
function bantuan(){app.innerHTML='<div class="gate" style="max-width:640px"><h2>Konfigurasi belum diisi</h2><div>Isi <b>FB</b> dan <b>ADMIN_EMAILS</b> di bagian atas script terakhir pada file ini, sesuai panduan.</div></div>'}
function flash(m,bad){const d=document.createElement("div");d.className="msg"+(bad?"":" okmsg");d.style.marginBottom="12px";d.textContent=m;setTimeout(()=>app.prepend(d),0)}
function masuk(){
  app.innerHTML='<div class="gate"><h2>Masuk</h2><div class="note">Pilih peran Anda, lalu masuk dengan akun Google.</div><button class="btn" data-p="kepala">Masuk sebagai Kepala sekolah</button><button class="btn ghost" data-p="operator">Masuk sebagai Operator sekolah</button><button class="btn ghost" data-p="guru">Masuk sebagai Guru</button><button class="btn ghost" data-p="pengawas">Masuk sebagai Pengawas (admin)</button><div id="err"></div></div>';
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{try{localStorage.setItem("peran_pilihan",b.dataset.p)}catch(e){}
    firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{$("#err").innerHTML='<div class="msg">Gagal masuk: '+esc(e.code||e.message)+'</div>'})})}
function init(){
  if(FB.apiKey.startsWith("ISI"))return bantuan();
  firebase.initializeApp(FB);db=firebase.firestore();
  firebase.auth().onAuthStateChanged(u=>{if(!u){started=false;return masuk()}if(started)return;started=true;mulai(u)});
}
function mulai(u){
  me=u.uid;isPengawas=ADMIN_EMAILS.map(x=>x.toLowerCase()).includes((u.email||"").toLowerCase());
  $("#role").textContent=isPengawas?"Pengawas (admin)":"Kepala sekolah / operator / guru";
  try{if(localStorage.getItem("peran_pilihan")==="pengawas"&&!isPengawas)flash("Email ini tidak terdaftar sebagai pengawas. Anda masuk sebagai kepala sekolah atau operator.",1)}catch(e){}
  if(!$("#out")){document.querySelector("header.top").insertAdjacentHTML("beforeend",'<button class="btn ghost" id="out">Keluar</button>');$("#out").onclick=()=>firebase.auth().signOut().then(()=>location.reload())}
  sn(db.collection("sekolah"),s=>{sek=rows(s).sort((a,b)=>(a.nama||"").localeCompare(b.nama||""));
    if(isPengawas)sek.forEach(x=>{if(!sub[x.id])sub[x.id]=sn(db.collection("sekolah/"+x.id+"/surat"),r=>{lst[x.id]=rows(r);letters=[].concat(...Object.values(lst)).sort(byNew);render()})});
    if(!cur)render()});
  if(isPengawas){
    sn(db.collection("pengajuan"),s=>{peng=rows(s);render()});
    sn(db.collection("disetujui"),s=>{appr=rows(s);render()});
  }else{
    sn(db.doc("disetujui/"+me),s=>{akses=s.exists?s.data():null;if(unsub){unsub();unsub=null}
      if(akses&&akses.sekolahId)unsub=sn(db.collection("sekolah/"+akses.sekolahId+"/surat"),r=>{letters=rows(r).sort(byNew);if(!cur)render()});
      else letters=[];
      if(!cur)render()});
    sn(db.doc("pengajuan/"+me),s=>{pj=s.exists?s.data():null;if(!cur)render()});
  }
  render();
}
let buat=false;
function renderBuat(){
  const today=new Date().toISOString().slice(0,10);
  app.innerHTML=`<div class="bar noprint"><button class="btn ghost" id="b_back">Batal</button></div>
  <div class="form"><h3>Surat baru untuk pengawas</h3>
  <div class="g2"><label>Judul surat<input type="text" id="b_judul" placeholder="Contoh: Surat Permohonan ..."></label><label>Nomor surat (opsional)<input type="text" id="b_nomor"></label></div>
  <label>Kepada<input type="text" id="b_kepada" value="Pengawas Sekolah"></label>
  <div class="g2"><label>Tempat<input type="text" id="b_tempat" value="Parepare"></label><label>Tanggal surat<input type="date" id="b_tgl" value="${today}"></label></div>
  <label>Isi surat<textarea id="b_isi" rows="10" placeholder="Tulis isi surat. Setiap baris baru akan tampil sebagai baris baru di surat."></textarea></label>
  <details style="border:1px solid var(--line);border-radius:8px;padding:10px 12px"><summary style="cursor:pointer"><b>Kop surat</b> (klik untuk mengubah)</summary><div id="kophost" style="display:grid;gap:10px;margin-top:10px"></div><label style="display:flex;flex-direction:row;gap:8px;font-weight:400;align-items:center;margin-top:10px"><input type="checkbox" id="b_kopdef"> Simpan sebagai kop bawaan di perangkat ini</label></details>
  <div class="sign"><h3>Tanda tangan kepala sekolah</h3><div class="g2"><label>Nama lengkap<input type="text" id="b_nama" value="${esc(akses.nama)}"></label><label>NIP<input type="text" id="b_nip" value="${esc(akses.nip||"")}"></label></div><div id="padhost" style="display:grid;gap:12px"></div></div>
  <div id="err"></div><div><button class="btn" id="b_go">Kirim surat ke pengawas</button></div></div>
  <h3 class="noprint" style="margin:20px 0 8px">Pratinjau</h3><div id="pp"></div>`;
  let pad=null,ke=null;
  const data=()=>({judul:$("#b_judul").value.trim(),nomor:$("#b_nomor").value.trim(),kepada:$("#b_kepada").value.trim(),tempat:$("#b_tempat").value.trim()||"Parepare",tglSurat:$("#b_tgl").value,isi:$("#b_isi").value.trim(),pihak:"kepala",dari:"sekolah"});
  const obj=()=>{const g=pad.get(),nama=$("#b_nama").value.trim(),nip=$("#b_nip").value.trim();return{type:"kustom",school:akses.sekolahNama,sekolahId:akses.sekolahId,kepala:nama,kepNip:nip,kop:ke.get(),data:data(),sign:{nama,nip,img:g.img,h:g.h,at:new Date().toISOString()},status:"menunggu"}};
  const prev=()=>{$("#pp").innerHTML=paper(obj())};
  ke=kopEditor($("#kophost"),kopDef("supervisi"),prev);
  pad=padTtd($("#padhost"),prev);
  document.querySelectorAll("#b_judul,#b_nomor,#b_kepada,#b_tempat,#b_tgl,#b_isi,#b_nama,#b_nip").forEach(e=>e.oninput=prev);
  try{const sv=JSON.parse(localStorage.getItem("ttd_kepsek")||"null");if(sv&&sv.img)pad.load(sv.img,sv.h)}catch(e){}
  prev();
  $("#b_back").onclick=()=>{buat=false;render()};
  $("#b_go").onclick=async()=>{
    const o=obj();
    if(!o.data.judul||!o.data.isi||!o.kepala||!pad.has()){$("#err").innerHTML='<div class="msg">Lengkapi judul, isi surat, nama, dan tanda tangan (gambar atau scan).</div>';return}
    const id=Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b%32]).join("");
    $("#b_go").disabled=true;
    try{
      await db.doc("sekolah/"+akses.sekolahId+"/surat/"+id).set({...o,dibuatOleh:me,createdAt:new Date().toISOString()});
      try{const g=pad.get();localStorage.setItem("ttd_kepsek",JSON.stringify({img:g.img,h:g.h}))}catch(e){}
      if($("#b_kopdef").checked){try{localStorage.setItem("kop_supervisi",JSON.stringify(ke.get()))}catch(e){}}
      buat=false;render();flash("Surat terkirim ke pengawas.")
    }catch(e){$("#b_go").disabled=false;$("#err").innerHTML='<div class="msg">Surat belum terkirim ('+esc(e.code||e.message)+'). '+(e.code==="permission-denied"?"Akun Anda belum diizinkan membuat surat. Hubungi pengawas.":"Periksa koneksi lalu coba lagi.")+'</div>'}
  };
}
function renderKepsek(){
  if(cur)return renderSign();
  if(buat&&akses&&akses.peran==="kepala")return renderBuat();
  $("#role").textContent=akses?(akses.peran==="operator"?"Operator sekolah":akses.peran==="guru"?"Guru":"Kepala sekolah"):"Belum disetujui";
  if(akses){
    const vis=letters.filter(l=>{const p=(l.data&&l.data.pihak)||"kepala";return akses.peran==="guru"?(p==="guru"&&l.guruId===me):p==="kepala"}),w=vis.filter(l=>l.status==="menunggu"&&!own(l)).length;
    app.innerHTML=`<div class="stat" style="margin-bottom:16px"><b style="font-size:22px">${esc(akses.sekolahNama)}</b><span>Masuk sebagai ${esc(akses.nama)}${akses.peran==="operator"?" (operator sekolah)":akses.peran==="guru"?" (guru)":""} · ${w?w+(akses.peran==="operator"?" surat menunggu tanda tangan kepala sekolah":" surat menunggu tanda tangan Anda"):"tidak ada surat yang menunggu"}</span></div>
    ${akses.peran==="kepala"?'<div style="margin-bottom:12px"><button class="btn" id="buat">Buat surat untuk pengawas</button></div>':""}${vis.length?vis.map(l=>`<div class="row" tabindex="0" data-id="${l.id}"><div class="main"><b>${esc(judul(l))}</b><span>${own(l)?"Surat dari Anda untuk pengawas":"Dari Makmur Nonci, S.Pd., MM.Pd"} · ${tgl(l.createdAt)}</span></div><span class="badge ${l.status==="menunggu"?"wait":"ok"}">${own(l)?(l.status==="menunggu"?"Menunggu TTD pengawas":"Sudah ditandatangani pengawas"):l.status==="menunggu"?"Perlu ditandatangani":"Sudah ditandatangani"}</span></div>`).join(""):'<div class="empty">Belum ada surat untuk sekolah Anda.</div>'}`;
    if($("#buat"))$("#buat").onclick=()=>{buat=true;render()};
    document.querySelectorAll(".row").forEach(r=>{r.onclick=()=>{cur=vis.find(x=>x.id===r.dataset.id);render()};r.onkeydown=e=>{if(e.key==="Enter")r.click()}});
    return;
  }
  if(pj&&pj.status==="menunggu"){app.innerHTML=`<div class="gate"><h2>Menunggu persetujuan</h2><div>Permintaan akses Anda sebagai ${peranLabel(pj.peran).toLowerCase()} untuk <b>${esc(pj.sekolahNama)}</b> sudah dikirim. Halaman ini otomatis terbuka begitu pengawas menyetujuinya.</div></div>`;return}
  const note=pj&&pj.status==="ditolak"?"Permintaan sebelumnya ditolak. Periksa data Anda lalu ajukan kembali.":pj&&pj.status==="dicabut"?"Akses Anda dicabut. Anda dapat mengajukan kembali.":"";
  app.innerHTML=`<div class="gate"><h2>Daftar ke ruang sekolah</h2><div class="note">Pilih sekolah Anda. Pengawas akan memeriksa lalu menyetujui akses Anda.</div>${note?`<div class="msg">${note}</div>`:""}
  <label>Nama lengkap<input id="a_nama" ${inp} style="font:inherit;letter-spacing:0;text-align:left;text-transform:none" value="${esc(pj&&pj.nama)}"></label><label>NIP<input id="a_nip" ${inp} style="font:inherit;letter-spacing:0;text-align:left;text-transform:none" value="${esc(pj&&pj.nip)}"></label>
  <label>Daftar sebagai<select id="a_peran" ${inp}><option value="kepala">Kepala sekolah</option><option value="operator">Operator sekolah (mewakili kepala sekolah yang belum mendaftar)</option><option value="guru">Guru (menandatangani surat yang ditujukan kepada guru)</option></select></label><label>Sekolah<select id="a_sek" ${inp}>${sek.length?sek.map(x=>`<option value="${x.id}">${esc(x.nama)}</option>`).join(""):'<option value="">Belum ada sekolah terdaftar</option>'}</select></label><div id="err"></div><button class="btn" id="a_go">Ajukan akses</button></div>`;
  try{const pp=localStorage.getItem("peran_pilihan");if(pp==="operator"||pp==="kepala"||pp==="guru")$("#a_peran").value=pp}catch(e){}
  $("#a_go").onclick=async()=>{const nama=$("#a_nama").value.trim(),sid=$("#a_sek").value,sk=sek.find(x=>x.id===sid);
    if(!nama||!sk){$("#err").innerHTML='<div class="msg">Isi nama dan pilih sekolah Anda.</div>';return}
    try{await db.doc("pengajuan/"+me).set({nama,nip:$("#a_nip").value.trim(),peran:$("#a_peran").value,sekolahId:sid,sekolahNama:sk.nama,status:"menunggu",createdAt:new Date().toISOString()})}
    catch(e){$("#err").innerHTML='<div class="msg">Permintaan belum terkirim. Coba lagi.</div>'}};
}
function vSek(){
  $("#body").innerHTML=`<div class="form"><label>Tambah sekolah binaan<textarea id="sn" rows="4" placeholder="Satu nama sekolah per baris"></textarea></label><div><button class="btn" id="sadd">Tambahkan</button></div></div><div style="margin-top:16px">${sek.length?sek.map(x=>{const k=appr.filter(a=>a.sekolahId===x.id&&(a.peran||"kepala")==="kepala"),op=appr.filter(a=>a.sekolahId===x.id&&a.peran==="operator"),gr=appr.filter(a=>a.sekolahId===x.id&&a.peran==="guru");return`<div class="row" style="cursor:default"><div class="main"><b>${esc(x.nama)}</b><span>${k.length?"Kepala sekolah: "+esc(k.map(a=>a.nama).join(", ")):"Belum ada kepala sekolah terdaftar"}${op.length?" · Operator: "+esc(op.map(a=>a.nama).join(", ")):""}${gr.length?" · Guru: "+esc(gr.map(a=>a.nama).join(", ")):""} · ${letters.filter(l=>l.sekolahId===x.id).length} surat</span></div><button class="btn danger" data-ds="${x.id}">Hapus</button></div>`}).join(""):'<div class="empty">Belum ada sekolah binaan. Tambahkan nama sekolah di atas.</div>'}</div>`;
  $("#sadd").onclick=async()=>{const ls=$("#sn").value.split("\n").map(x=>x.trim()).filter(x=>x&&!sek.some(y=>y.nama===x));if(!ls.length)return;const bt=$("#sadd");bt.disabled=true;
    try{for(const n of ls)await tulis(db.doc("sekolah/"+rid()).set({nama:n}));$("#sn").value=""}
    catch(e){bt.insertAdjacentHTML("afterend",'<div class="msg" style="margin-top:8px">Gagal menyimpan ('+esc(e.code||e.message)+'). '+(e.code==="permission-denied"?"Periksa aturan Firestore dan email admin.":"Periksa koneksi dan pastikan Firestore sudah dibuat.")+'</div>')}
    bt.disabled=false};
  document.querySelectorAll("[data-ds]").forEach(b=>b.onclick=async()=>{if(confirm("Hapus sekolah ini dari daftar?"))await db.doc("sekolah/"+b.dataset.ds).delete()});
}
function vIzin(){
  const wait=peng.filter(p=>p.status==="menunggu"&&!appr.find(a=>a.id===p.id));
  const item=(p,btns)=>`<div class="row" style="cursor:default"><div class="main"><b>${esc(p.nama)}</b><span>${peranLabel(p.peran)} · ${esc(p.sekolahNama)} · NIP ${esc(p.nip||"-")}</span></div>${btns}</div>`;
  $("#body").innerHTML=`<h3 style="margin-bottom:8px">Menunggu persetujuan</h3>${wait.length?wait.map(p=>item(p,`<button class="btn" data-ok="${p.id}">Setujui</button><button class="btn danger" data-no="${p.id}">Tolak</button>`)).join(""):'<div class="empty">Tidak ada permintaan baru.</div>'}
  <h3 style="margin:20px 0 8px">Akun yang disetujui</h3>${appr.length?appr.map(a=>item({...a,sekolahNama:a.sekolahNama},`<button class="btn danger" data-rv="${a.id}">Cabut akses</button>`)).join(""):'<div class="empty">Belum ada akun yang disetujui.</div>'}`;
  const act=(sel,fn)=>document.querySelectorAll(sel).forEach(b=>b.onclick=async()=>{b.disabled=true;try{await fn(b)}catch(e){b.disabled=false;if(e)flash("Gagal: "+(e.code||e.message),1)}});
  act("[data-ok]",async b=>{const p=peng.find(x=>x.id===b.dataset.ok);await db.doc("disetujui/"+p.id).set({nama:p.nama,nip:p.nip||"",peran:p.peran||"kepala",sekolahId:p.sekolahId,sekolahNama:p.sekolahNama,at:new Date().toISOString()});await db.doc("pengajuan/"+p.id).update({status:"disetujui"})});
  act("[data-no]",b=>db.doc("pengajuan/"+b.dataset.no).update({status:"ditolak"}));
  act("[data-rv]",async b=>{if(!confirm("Cabut akses akun ini?"))throw 0;await db.doc("disetujui/"+b.dataset.rv).delete();await db.doc("pengajuan/"+b.dataset.rv).update({status:"dicabut"})});
}
init();
</script>
</body>
</html>
